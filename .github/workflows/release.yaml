# The mechanical CRAN release checks from blockr.ci, reported in one
# comment on the pull request, and once they pass, a CRAN-style reverse
# dependency check from r-devel/recheck. Runs only while the pull request
# carries the `release` label. A job skipped here never creates the called
# workflow's check contexts, so drop the `if:` before requiring any of
# them in a ruleset. Never require the recheck: upstream calls it
# "typically too volatile to use as an automatic pass/fail CI test".
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  release:
    if: contains(github.event.pull_request.labels.*.name, 'release')
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/release-gate.yaml@main

  # Checks each CRAN dependent against adbi's CRAN release and against this
  # branch, and reports what changed. The label test repeats the gate's,
  # since the gate reports success on unlabelled pull requests once its
  # `if:` is dropped.
  recheck:
    needs: release
    if: contains(github.event.pull_request.labels.*.name, 'release')
    permissions:
      contents: read
    uses: r-devel/recheck/.github/workflows/recheck.yml@ef259e57a8712b89bfb3093a73e082f5fdde79fe # v1
    with:
      # Also covers the dependents that only suggest adbi, which on CRAN
      # are all of them.
      which: most
