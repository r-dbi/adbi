# CRAN-style reverse dependency check from r-devel/recheck: it checks each
# CRAN dependent against adbi's CRAN release and against this branch, and
# reports what changed. Runs by hand on any branch, and on pull requests
# while they carry the `release` label. Never make it a required check:
# upstream calls it "typically too volatile to use as an automatic
# pass/fail CI test".
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

name: recheck

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recheck:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'release')
    uses: r-devel/recheck/.github/workflows/recheck.yml@ef259e57a8712b89bfb3093a73e082f5fdde79fe # v1
    with:
      # Also covers the dependents that only suggest adbi, which on CRAN
      # are all of them.
      which: most
