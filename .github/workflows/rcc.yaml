# Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: rcc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::rcmdcheck, roxygen2@8.1.0, local::.
          needs: check

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check that the documentation is up to date
        run: |
          git add --all
          git diff --cached --exit-code

      - uses: r-lib/actions/check-r-package@v2

  check:
    needs: smoke

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: '4.1', extra-packages: 'arrow=?ignore-before-r=4.2.0'}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, ${{ matrix.config.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2

  suggests:
    needs: smoke

    name: Without suggested packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: any::rcmdcheck, any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2

  coverage:
    needs: smoke

    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

  pkgdown:
    needs: smoke

    name: Website
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build the website
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy the website
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

  rcc:
    needs: [smoke, check, suggests, coverage, pkgdown]
    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
